[project]
name = "guild-manager-bench"
version = "0.1.0"
description = "A guild management strategy game core with visualization and runtime APIs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[project.scripts]
guild-manager = "guild_manager_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guild_manager_bench"]

[dependency-groups]
dev = [
    "pytest>=8",
]
