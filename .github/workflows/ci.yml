name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run tests
        run: uv run pytest tests -q

      - name: Check frontend scripts
        run: |
          node --check web/static/app.js
          node --check web/replay/app.js
          node --check web/replay/compare.mjs
          node --check web/replay/compare-model.mjs

      - name: Test replay comparison
        run: node --test tests/frontend/compare-model.test.mjs

      - name: Install browser for replay comparison
        if: matrix.python-version == '3.12'
        run: uv run --with playwright==1.63.0 python -m playwright install --with-deps chromium

      - name: Smoke test replay comparison in browser
        if: matrix.python-version == '3.12'
        run: uv run --with playwright==1.63.0 python tests/frontend/smoke_compare.py
