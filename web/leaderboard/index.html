<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Guild Manager Bench · Leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===== Header ===== -->
  <header class="header">
    <div class="header-inner">
      <div class="header-brand">
        <div class="header-icon">⚔</div>
        <div>
          <h1 class="header-title">Guild Manager Bench</h1>
          <p class="header-subtitle">模型排行榜</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="tab-btn active" data-tab="leaderboard" id="tabLeaderboard">排行榜</button>
        <button class="tab-btn" data-tab="curves" id="tabCurves">曲线对比</button>
      </div>
      <div class="header-meta" id="topMeta">
        <div class="spinner-wrap">
          <div class="spinner"></div>
          <span>加载数据中…</span>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== Leaderboard Content ===== -->
  <main class="main" id="leaderboardMain">
    <div class="loading-state" id="loadingState">
      <div class="loading-spinner"></div>
      <p>正在加载排行榜数据…</p>
    </div>
  </main>

  <!-- ===== Curve Comparison ===== -->
  <main class="main" id="curvesMain" style="display:none">
    <div class="curve-panel">
      <div class="curve-toolbar">
        <div class="curve-toolbar-left">
          <span class="curve-toolbar-label">选择运行：</span>
          <button class="curve-btn" id="curveSelectAll">全选</button>
          <button class="curve-btn" id="curveDeselectAll">清除</button>
        </div>
      </div>
      <div class="curve-body">
        <div class="curve-chart-wrap">
          <canvas id="curveChart"></canvas>
        </div>
        <div class="curve-legend" id="curveLegend">
          <div class="curve-legend-placeholder">加载数据后可在此选择运行的曲线</div>
        </div>
      </div>
    </div>
  </main>

  <!-- ===== Footer ===== -->
  <footer class="footer">
    <div class="footer-inner">
      <span>将 replay JSON 放入 <code>web/leaderboard/data/</code></span>
      <span class="footer-sep">·</span>
      <span>运行 <code>uv run guild-manager build-leaderboard</code> 生成数据</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
