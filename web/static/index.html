<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Guild Manager Bench</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-brand">
        <h1>Guild Manager Bench</h1>
        <div id="sessionMeta" class="muted">未连接</div>
      </div>
      <div class="topbar-actions">
        <button id="newSessionButton" type="button">新会话</button>
      </div>
    </header>

    <main class="layout">
      <section class="band" id="overview"></section>

      <nav class="tabs" id="tabBar">
        <button class="tab active" data-tab="squad">队伍</button>
        <button class="tab" data-tab="workshop">工坊</button>
        <button class="tab" data-tab="reports">战报</button>
        <button class="tab" data-tab="llm">LLM</button>
      </nav>

      <div class="tab-panel active" data-panel="squad">
        <div class="panel">
          <h2>冒险者</h2>
          <div id="adventurers"></div>
        </div>
      </div>

      <div class="tab-panel" data-panel="workshop">
        <div class="grid three">
          <div class="panel">
            <h2>合成</h2>
            <div id="crafting"></div>
          </div>
          <div class="panel">
            <h2>装备</h2>
            <div id="equipment"></div>
          </div>
          <div class="panel">
            <h2>全局加成</h2>
            <div id="upgrades"></div>
          </div>
        </div>
      </div>

      <div class="tab-panel" data-panel="reports">
        <div class="grid two">
          <div class="panel">
            <h2>战斗记录</h2>
            <div id="battleLog" class="battle-log"></div>
          </div>
          <div class="panel">
            <h2>操作轨迹</h2>
            <div id="actionTimeline" class="timeline"></div>
          </div>
        </div>
        <div class="panel">
          <h2>事件</h2>
          <div id="events" class="events"></div>
        </div>
      </div>

      <div class="tab-panel" data-panel="llm">
        <div class="llm-grid">
          <div class="panel llm-config">
            <h2>模型调试</h2>
            <div class="llm-form">
              <label>
                <span>模型</span>
                <input id="llmModel" type="text" placeholder="OPENAI_MODEL" autocomplete="off" />
              </label>
              <label>
                <span>Base URL</span>
                <input id="llmBaseUrl" type="text" placeholder="https://api.openai.com/v1" autocomplete="off" />
              </label>
              <label>
                <span>API Key</span>
                <input id="llmApiKey" type="password" placeholder="留空则使用服务端环境变量" autocomplete="off" />
              </label>
              <label>
                <span>非 end_turn 预算</span>
                <input id="llmMaxToolCalls" type="number" min="0" value="20" />
              </label>
              <label>
                <span>Temperature</span>
                <input id="llmTemperature" type="number" min="0" max="2" step="0.1" placeholder="默认" />
              </label>
              <label class="llm-wide">
                <span>目标</span>
                <textarea id="llmObjective" rows="3">最大化本局最终表现：尽量赢得战斗、提升队伍、积累有价值资源。</textarea>
              </label>
              <div class="llm-controls">
                <button id="llmStartButton" type="button" class="btn-primary">开始真实模型调试</button>
                <button id="llmStopButton" type="button" disabled>停止</button>
              </div>
            </div>
            <div id="llmStatus" class="llm-status muted">未启动</div>
          </div>

          <div class="panel llm-context">
            <h2>当前上下文</h2>
            <pre id="llmPrompt" class="llm-pre">尚未开始</pre>
          </div>
        </div>

        <div class="llm-grid lower">
          <div class="panel">
            <h2>模型输出</h2>
            <div id="llmTranscript" class="llm-transcript"></div>
          </div>
          <div class="panel">
            <h2>工具调用</h2>
            <div id="llmToolTrace" class="llm-tool-trace"></div>
          </div>
        </div>

        <div class="panel">
          <h2>调试事件</h2>
          <div id="llmEventLog" class="llm-event-log"></div>
        </div>
      </div>
    </main>

    <div id="combatModal" class="modal-overlay" hidden>
      <div class="modal">
        <div class="modal-head">
          <h2>选择交战目标</h2>
          <button type="button" class="modal-close" onclick="closeCombatModal()">&times;</button>
        </div>
        <div id="modalHunts" class="modal-body"></div>
        <div class="modal-foot">
          <button id="modalEndTurn" type="button" class="btn-primary" onclick="endTurn()">结束回合</button>
        </div>
      </div>
    </div>

    <div id="equipPopup" class="equip-popup" hidden></div>
    <div id="toast" class="toast" hidden></div>
    <script src="/app.js"></script>
  </body>
</html>
