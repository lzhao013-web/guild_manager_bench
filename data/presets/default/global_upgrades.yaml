upgrades:
  - id: training_ground
    name: 训练场
    gold: 35
    stats:
      hp: 10
      attack: 3

  - id: armory
    name: 军械库
    gold: 45
    required:
      - training_ground
    stats:
      attack: 5
      defense: 3

  - id: field_medicine
    name: 野战医疗
    gold: 40
    stats:
      recovery: 5
      mp: 4

  - id: tactical_drills
    name: 战术演练
    gold: 55
    required:
      - training_ground
    stats:
      speed: 3
    skills:
      - id: coordinated_assault
        name: 协同攻势
        kind: passive
        condition:
          type: self_hp_pct_gte
          value: 0.6
        effects:
          - type: stat_bonus
            stat: attack
            value: 4
            target: self

  - id: veteran_command
    name: 老兵指挥
    gold: 70
    required:
      - armory
      - tactical_drills
    stats:
      hp: 20
      attack: 4
      defense: 4
      speed: 2

  - id: guild_contracts
    name: 公会契约
    gold: 75
    required:
      - training_ground
    party_size_bonus: 1
    stats:
      hp: 6
      recovery: 1

  - id: expanded_roster
    name: 扩编名册
    gold: 115
    required:
      - guild_contracts
      - veteran_command
    party_size_bonus: 2
    stats:
      hp: 12
      defense: 2

  - id: combat_alchemy
    name: 战斗炼金
    gold: 60
    required:
      - field_medicine
    stats:
      mp: 6
    skills:
      - id: corrosive_vial
        name: 腐蚀药瓶
        kind: active
        priority: 155
        mp_cost: 5
        once_per_battle: true
        condition:
          type: all
          conditions:
            - type: action_index_lte
              value: 5
            - type: self_mp_pct_gte
              value: 0.25
        effects:
          - type: apply_status
            target: target
            status:
              id: armor_break
              name: 破甲
              duration: 2
              polarity: negative
              stack_mode: refresh
              effects:
                - type: stat_multiplier
                  stat: defense
                  value: 0.8
                  target: self

  - id: rally_banner
    name: 集结旗帜
    gold: 65
    required:
      - tactical_drills
    stats:
      hp: 8
      speed: 1
    skills:
      - id: opening_rally
        name: 开场鼓舞
        kind: active
        priority: 190
        once_per_battle: true
        condition:
          type: action_index_lte
          value: 3
        effects:
          - type: apply_status
            target: self
            status:
              id: inspired
              name: 鼓舞
              duration: 2
              polarity: positive
              stack_mode: refresh
              effects:
                - type: stat_bonus
                  stat: attack
                  value: 4
                  target: self
                - type: stat_bonus
                  stat: speed
                  value: 2
                  target: self
