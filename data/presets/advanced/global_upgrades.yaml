upgrades:
  # 公共扩编独立于战斗专精。全部成本均为一次性支出。
  - id: roster_expansion_1
    name: 扩编 I
    branch: common
    tier: 1
    gold: 350
    experience: 200
    materials: {iron_ore: 6, bone: 6}
    description: 增加一个队伍位置，不是战斗分支的前置。
    party_size_bonus: 1

  - id: roster_expansion_2
    name: 扩编 II
    branch: common
    tier: 2
    gold: 600
    experience: 450
    materials: {iron_ore: 10, beast_hide: 4}
    required: [roster_expansion_1]
    party_size_bonus: 2

  - id: craft_standardization
    name: 工艺标准化
    branch: economy
    tier: 2
    gold: 150
    experience: 50
    materials: {iron_ore: 4}
    required: [blacksmith]
    description: 后续制作装备的金币费用降低15%，向上取整。材料消耗不变，不返还历史支出。
    craft_gold_discount_percent: 15

  - id: training_manual
    name: 训练教范
    branch: economy
    tier: 2
    gold: 100
    experience: 80
    materials: {herb: 2, arcane_dust: 2}
    required: [training_grounds]
    description: 后续胜利讨伐经验增加6%，与后续教范加成相加，逐场一次向下取整。
    hunt_experience_bonus_percent: 6

  # 武备：短战斗与输出。突击、终结为可选旁支。
  - id: training_grounds
    name: 训练场
    branch: martial
    tier: 1
    gold: 65
    materials: {iron_ore: 2, bone: 2}
    stats: {attack: 3, hp: 5}

  - id: blacksmith
    name: 铁匠铺
    branch: martial
    tier: 1
    gold: 80
    materials: {iron_ore: 3, bone: 2}
    stats: {attack: 4, defense: 2}

  - id: armory
    name: 军械库
    branch: martial
    tier: 2
    gold: 240
    experience: 400
    materials: {iron_ore: 6, mithril_shard: 4}
    required: [blacksmith]
    stats: {attack: 6, defense: 4, hp: 8}

  - id: assault_doctrine
    name: 突击战术
    branch: martial
    tier: 2
    gold: 180
    experience: 300
    materials: {mithril_shard: 3, beast_hide: 3}
    required: [training_grounds]
    description: 全场双方合计前6次行动，攻击提高12%。
    skills: [talent_assault]

  - id: reinforced_forge
    name: 强化锻造
    branch: martial
    tier: 3
    gold: 350
    experience: 650
    materials: {mithril_shard: 8, sharp_claw: 10}
    required: [armory]
    stats: {attack: 7, defense: 5}

  - id: execution_doctrine
    name: 终结战术
    branch: martial
    tier: 3
    gold: 360
    experience: 550
    materials: {sharp_claw: 12, soul_shard: 6}
    required: [assault_doctrine]
    description: 敌方HP不高于30%时，攻击提高18%。
    skills: [talent_execution]

  - id: elite_hunters
    name: 精锐猎兵团
    branch: martial
    tier: 3
    gold: 600
    experience: 850
    materials: {spider_silk: 6, mithril_shard: 6}
    required: [armory]
    stats: {attack: 9, speed: 5, hp: 12}

  - id: war_academy
    name: 战争学院
    branch: martial
    tier: 4
    gold: 950
    experience: 1500
    materials: {dragon_scale: 18, demon_core: 6}
    required: [reinforced_forge, elite_hunters]
    excludes: [paladin_order, arcane_council]
    description: 武备终阶专精，与圣殿骑士团、秘法结社互斥。不可洗点。
    stats: {attack: 14, defense: 7, hp: 20, speed: 4}

  # 生存：持续作战。应急救护不是终阶前置。
  - id: herb_garden
    name: 草药园
    branch: survival
    tier: 1
    gold: 60
    materials: {herb: 2, bone: 1}
    stats: {hp: 6, mp: 4, recovery: 4, mp_recovery: 4}

  - id: supply_post
    name: 补给站
    branch: survival
    tier: 1
    gold: 65
    materials: {herb: 3, beast_hide: 2}
    stats: {hp: 4, recovery: 6, mp_recovery: 6, defense: 1}

  - id: field_hospital
    name: 野战医院
    branch: survival
    tier: 2
    gold: 220
    experience: 400
    materials: {herb: 10, spider_silk: 4}
    required: [herb_garden, supply_post]
    stats: {hp: 10, mp: 6, recovery: 8, mp_recovery: 8}

  - id: emergency_care
    name: 应急救护
    branch: survival
    tier: 2
    gold: 200
    experience: 300
    materials: {herb: 4, arcane_dust: 2}
    required: [herb_garden]
    description: 每战一次，自身行动开始且存活、HP不高于30%时恢复25%最大HP。不占普通主动选择，可停用。
    skills: [talent_emergency_care]

  - id: endurance_doctrine
    name: 持久战法
    branch: survival
    tier: 2
    gold: 360
    experience: 550
    materials: {bone: 12, mithril_shard: 5}
    required: [supply_post]
    description: 全场双方合计第9次行动起，防御提高15%。
    skills: [talent_endurance]

  - id: veteran_command
    name: 老兵指挥部
    branch: survival
    tier: 3
    gold: 600
    experience: 900
    materials: {iron_ore: 10, mithril_shard: 8}
    required: [field_hospital]
    stats: {hp: 18, attack: 7, defense: 6, speed: 3}

  - id: paladin_order
    name: 圣殿骑士团
    branch: survival
    tier: 4
    gold: 750
    experience: 1500
    materials: {dragon_scale: 18, soul_shard: 16}
    required: [veteran_command, endurance_doctrine]
    excludes: [war_academy, arcane_council]
    description: 生存终阶专精，与战争学院、秘法结社互斥。提供战斗属性而非仅战后回复。
    stats: {hp: 30, defense: 12, attack: 5, recovery: 10, mp_recovery: 10}

  # 奥术：技能循环与机动。充盈施法、法力回流为可选旁支。
  - id: scout_network
    name: 侦查网
    branch: arcane
    tier: 1
    gold: 70
    materials: {sharp_claw: 3, beast_hide: 2}
    stats: {speed: 3, attack: 2}

  - id: meditation_hall
    name: 精神修炼堂
    branch: arcane
    tier: 2
    gold: 260
    experience: 450
    materials: {arcane_dust: 8, herb: 8}
    required: [scout_network]
    stats: {mp: 8, speed: 3, recovery: 6, mp_recovery: 6}

  - id: tactics_academy
    name: 战术学院
    branch: arcane
    tier: 2
    gold: 300
    experience: 500
    materials: {spider_silk: 6, mithril_shard: 4}
    required: [scout_network]
    stats: {speed: 4, attack: 4, defense: 3}

  - id: mana_abundance
    name: 充盈施法
    branch: arcane
    tier: 2
    gold: 220
    experience: 350
    materials: {arcane_dust: 5, spider_silk: 3}
    required: [scout_network]
    description: 自身MP不低于70%时，攻击提高10%。
    skills: [talent_mana_abundance]

  - id: mana_reflux
    name: 法力回流
    branch: arcane
    tier: 3
    gold: 220
    experience: 350
    materials: {arcane_dust: 6, herb: 4}
    required: [scout_network]
    description: 每战一次，自身行动开始且MP不高于25%时，恢复30%最大MP，至少12MP，不超过上限。无MP池不触发。不占普通主动选择，可停用。
    skills: [talent_mana_reflux]

  - id: arcane_council
    name: 秘法结社
    branch: arcane
    tier: 4
    gold: 900
    experience: 1500
    materials: {demon_core: 6, dragon_blood: 18, soul_shard: 20}
    required: [meditation_hall, tactics_academy]
    excludes: [war_academy, paladin_order]
    description: 奥术终阶专精，与战争学院、圣殿骑士团互斥。不可洗点。
    stats: {mp: 16, attack: 10, speed: 6, hp: 12}

  # 新节点追加，保留原25项的顺序和标识。
  - id: training_manual_2
    name: 进阶教范
    branch: economy
    tier: 3
    gold: 130
    experience: 160
    materials: {mithril_shard: 4, spider_silk: 2, arcane_dust: 4}
    required: [training_manual, scout_network]
    description: 后续胜利讨伐经验再增加8%，与训练教范累计14%。
    hunt_experience_bonus_percent: 8

  - id: training_manual_3
    name: 大师研习
    branch: economy
    tier: 4
    gold: 180
    experience: 280
    materials: {dragon_scale: 8, dragon_blood: 5, soul_shard: 6}
    required: [training_manual_2]
    description: 后续胜利讨伐经验再增加12%，三阶累计26%。加成不追溯历史奖励。
    hunt_experience_bonus_percent: 12

  - id: trade_network
    name: 狩猎委托
    branch: economy
    tier: 3
    gold: 280
    experience: 80
    materials: {iron_ore: 6, beast_hide: 4, sharp_claw: 6}
    required: [craft_standardization, scout_network]
    description: 精英、首领胜利金币增加18%，手动刷新基础价降低10%。固定挑战不在高阶加成范围。
    elite_boss_gold_bonus_percent: 18
    monster_refresh_discount_percent: 10

  - id: guild_contracts
    name: 行会商路
    branch: economy
    tier: 4
    gold: 450
    experience: 120
    materials: {iron_ore: 10, beast_hide: 6, sharp_claw: 10}
    required: [trade_network, supply_post]
    description: 后续胜利金币再增加10%，普通累计10%、精英首领累计28%。刷新基础价再降低10%，累计20%。
    hunt_gold_bonus_percent: 10
    monster_refresh_discount_percent: 10

  - id: battle_coordination
    name: 作战协同
    branch: martial
    tier: 2
    gold: 150
    experience: 180
    materials: {iron_ore: 4, sharp_claw: 3}
    required: [training_grounds, scout_network]
    description: 敌HP不低于50%时，攻击固定加3并乘1.02，速度固定加1并乘1.02。
    skills: [talent_battle_coordination]

  - id: fortified_line
    name: 稳固战线
    branch: survival
    tier: 2
    gold: 150
    experience: 200
    materials: {iron_ore: 4, herb: 4}
    required: [supply_post, training_grounds]
    description: 自身HP不低于50%时，攻击固定加2并乘1.02，防御固定加2并乘1.05。
    skills: [talent_fortified_line]

  - id: mana_harmony
    name: 魔能协调
    branch: arcane
    tier: 2
    gold: 180
    experience: 220
    materials: {arcane_dust: 4, beast_hide: 2}
    required: [scout_network, herb_garden]
    description: 自身MP不低于50%时，攻击和防御分别固定加2并乘1.03。无MP池不触发。
    skills: [talent_mana_harmony]

  - id: siege_focus
    name: 攻坚战法
    branch: martial
    tier: 3
    gold: 450
    experience: 650
    materials: {mithril_shard: 8, soul_shard: 6, sharp_claw: 12}
    required: [battle_coordination]
    description: 双方累计第9次行动起，攻击乘1.25。
    skills: [talent_siege_focus]

  - id: last_bastion
    name: 绝境壁垒
    branch: survival
    tier: 3
    gold: 320
    experience: 450
    materials: {mithril_shard: 6, dragon_scale: 4, bone: 8}
    required: [fortified_line, herb_garden]
    description: 自身HP不高于45%时，防御乘1.40。不减免无视防御伤害。
    skills: [talent_last_bastion]

  - id: mana_acceleration
    name: 魔力疾行
    branch: arcane
    tier: 3
    gold: 500
    experience: 750
    materials: {arcane_dust: 12, soul_shard: 10, spider_silk: 8}
    required: [mana_harmony, meditation_hall]
    description: 自身MP不低于70%时，速度乘1.25。耗蓝后可能失效，无MP池不触发。
    skills: [talent_mana_acceleration]
